<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friday · Routines</title>
<link rel="icon" href="{{ICON}}">
<meta name="theme-color" content="#ffffff">
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --line: #e8e5df; --text: #1b1a17; --muted: #7a756c; --soft: #f0eee9;
  --accent: #6d5ae6; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
  --shadow: 0 1px 2px rgba(27,26,23,.04), 0 8px 24px rgba(27,26,23,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0c11; --surface: #11141b; --line: #1f2430; --text: #e8eaf0; --muted: #8a92a6; --soft: #171b25;
    --accent: #8b7cf6; --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; padding: 0 0 40px;
}
header { display: flex; align-items: center; gap: 12px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand b { font: 600 13px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: .32em; display: block; }
.brand span { font-size: 12px; color: var(--muted); }
.grow { flex: 1; }
.pill { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.pill.ok i { background: var(--ok); } .pill.bad i { background: var(--bad); }
main { max-width: 560px; margin: 0 auto; padding: 18px 14px; }
h4 { margin: 18px 4px 8px; font: 600 11px/1 "Segoe UI", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .what { flex: 1; min-width: 0; }
.item .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.item .d { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.item .d b { font-weight: 500; color: var(--text); }
.item.off .t, .item.off .d b { color: var(--muted); }
.kind { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--soft); color: var(--muted); margin-right: 6px; vertical-align: 1px; }
.kind.alarm { color: var(--warn); }
.kind.phone { color: var(--accent); }
.item .desc { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
.item.off .desc { opacity: .7; }
.empty { padding: 26px 14px; text-align: center; color: var(--muted); }
/* the switch */
.sw { position: relative; width: 48px; height: 28px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; z-index: 1; }
.sw .k { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .18s; }
.sw .k::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .18s; }
.sw input:checked + .k { background: var(--ok); }
.sw input:checked + .k::after { transform: translateX(20px); }
.sw input:disabled + .k { opacity: .5; }
.sw input:focus-visible + .k { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>FRIDAY</b><span>Routines &amp; reminders</span></div>
  <div class="grow"></div>
  <div class="pill" id="pill"><i></i><span>connecting…</span></div>
</header>
<main>
  <div id="sections"><h4>Routines</h4><div class="card"><div class="empty">Loading…</div></div></div>
  <h4>Reminders &amp; alarms</h4>
  <div class="card" id="others"><div class="empty">Loading…</div></div>
  <p class="foot">Off keeps a routine but stops it firing. Say "cancel" to Friday to delete one. "Phone" ones are run by Friday on your phone.</p>
</main>
<div class="toast" id="toast"></div>
<script>
const KEY = "{{KEY}}";
const $ = s => document.querySelector(s);
async function call(path, body) {
  const r = await fetch(path, {method: body === undefined ? "GET" : "POST",
    headers: {"X-Friday-Token": KEY, "Content-Type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body)});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800); }
function pill(ok, text) { const p = $("#pill"); p.className = "pill " + (ok ? "ok" : "bad"); p.querySelector("span").textContent = text; }
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function whenText(r) {
  if (!r.when) return r.trigger === "laptop_open" ? "when the laptop opens" : "no time set";
  const d = new Date(r.when), now = new Date();
  const hm = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  const sameDay = d.toDateString() === now.toDateString();
  const tmrw = new Date(now); tmrw.setDate(now.getDate() + 1);
  const day = sameDay ? "today" : d.toDateString() === tmrw.toDateString() ? "tomorrow" : DAYS[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth() + 1);
  return hm + " " + day;
}
function repeatText(r) {
  if (!r.repeat) return "once";
  const m = /every\s*(\d+)?\s*(m|min|mins|minutes?|h|hrs?|hours?)\b(?:\s*(?:and\s*)?(\d+)\s*(?:m|min|mins|minutes?))?/i.exec(r.repeat);
  if (m) {
    const n = m[1] || "1", h = /^h/i.test(m[2]);
    return "every " + (h ? (n + (m[3] ? "½" : "") + " h") : (n + " min")) + " · 8 am–11 pm";
  }
  return r.repeat === "hourly" ? "every hour · 8 am–11 pm" : r.repeat === "office days" ? "Mon–Sat" : r.repeat;
}
function row(r) {
  const el = document.createElement("div");
  el.className = "item" + (r.enabled ? "" : " off");
  el.dataset.id = r.id;
  el.innerHTML = `<div class="what"><div class="t"></div><div class="d"><b></b> · <span class="rep"></span></div><div class="desc"></div></div>
    <label class="sw"><input type="checkbox" aria-label="On or off"><span class="k"></span></label>`;
  const t = el.querySelector(".t");
  if (r.kind === "alarm") { const k = document.createElement("span"); k.className = "kind alarm"; k.textContent = "alarm"; t.appendChild(k); }
  if (r.runs_on === "phone") { const k = document.createElement("span"); k.className = "kind phone"; k.textContent = "phone"; t.appendChild(k); }
  t.appendChild(document.createTextNode(r.name === "brief" ? "Morning brief" : r.text));
  el.querySelector(".d b").textContent = r.name === "brief" ? "first time at the laptop after 5 am" : whenText(r);
  el.querySelector(".rep").textContent = repeatText(r);
  const desc = el.querySelector(".desc");
  if (r.description) desc.textContent = r.description; else desc.remove();
  const cb = el.querySelector("input");
  cb.checked = !!r.enabled;
  cb.onchange = async () => {
    cb.disabled = true;
    try {
      const res = await call("/reminders/set", {id: r.id, name: r.name || "", enabled: cb.checked});
      if (!res.changed || !res.changed.length) throw new Error("not found");
      toast((cb.checked ? "On: " : "Off: ") + r.text);
      await load();
    } catch (e) { cb.checked = !cb.checked; toast("Couldn't change it: " + e.message); }
    cb.disabled = false;
  };
  return el;
}
function fill(box, items, empty) {
  box.innerHTML = "";
  if (!items.length) { box.innerHTML = `<div class="empty">${empty}</div>`; return; }
  items.forEach(r => box.appendChild(row(r)));
}
async function load() {
  try {
    const res = await call("/reminders");
    const items = res.reminders || [];
    const routines = items.filter(r => r.name), others = items.filter(r => !r.name);
    others.sort((a, b) => (a.when || "9") < (b.when || "9") ? -1 : 1);
    const ORDER = ["Health", "Family", "Work", "Prayer", "Entertainment", "Shopping"];
    const groups = {};
    routines.forEach(r => { (groups[r.section || "Other"] = groups[r.section || "Other"] || []).push(r); });
    const names = Object.keys(groups).sort((a, b) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99) || a.localeCompare(b));
    const box = $("#sections"); box.innerHTML = "";
    if (!names.length) box.innerHTML = `<h4>Routines</h4><div class="card"><div class="empty">No routines yet.</div></div>`;
    names.forEach(s => {
      const h = document.createElement("h4"); h.textContent = s; box.appendChild(h);
      const card = document.createElement("div"); card.className = "card"; card.dataset.section = s; box.appendChild(card);
      fill(card, groups[s], "");
    });
    fill($("#others"), others, "Nothing pending. Say \"remind me…\" to Friday.");
    pill(true, "laptop Friday");
  } catch (e) { pill(false, "laptop unreachable"); }
}
load();
setInterval(load, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
